<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro AST - US Technologies</title>
    <style>
        /* Estilos base */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        
        .container { 
            background: white; 
            padding: 40px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px;
        }

        /* Encabezado con Logo */
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            height: 70px; /* Ajuste para el logo horizontal */
            width: auto;
            margin-bottom: 15px;
        }

        h2 { 
            color: #1a3a5a; 
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Formulario */
        .form-group { margin-bottom: 18px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #444;
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }

        /* Botones */
        button { 
            width: 100%; 
            background-color: #0056b3; 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            font-weight: bold;
            margin-top: 10px;
            transition: background 0.3s;
        }

        button:hover { background-color: #004494; }

        .btn-view {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .btn-view:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <!-- Imagen del logo cargada desde static/images/logo.png -->
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="US Technologies Logo" class="logo">
            <h2>Análisis Seguro de Trabajo (AST)</h2>
        </div>

        <form action="/ast" method="POST">
            <div class="form-group">
                <label>Nombre del Responsable:</label>
                <input type="text" name="responsable" placeholder="Ej. Luis Osnaya" required>
            </div>

            <div class="form-group">
                <label>Área de Trabajo:</label>
                <input type="text" name="area" placeholder="Ej. Mantenimiento / Planta" required>
            </div>

            <div class="form-group">
                <label>Tarea a Realizar:</label>
                <textarea name="tarea" rows="2" placeholder="DESCRIBA LA ACTIVIDAD..." required></textarea>
            </div>

            <div class="form-group">
                <label>Riesgo Identificado:</label>
                <select name="riesgo" required>
                    <option value="" disabled selected>Seleccione un riesgo</option>
                    <option value="Caídas">Caídas a distinto nivel</option>
                    <option value="Eléctrico">Riesgo Eléctrico</option>
                    <option value="Atrapamiento">Atrapamiento</option>
                    <option value="Químico">Exposición Química</option>
                    <option value="Corte"> Cortes</option>
                    <option value="Golpe por proyectil u objetos desviados">Golpe por proyectil u objetos desviados</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Medida de Control:</label>
                <input type="text" name="control" placeholder="Ej. Uso de arnés / Bloqueo LOTO" required>
            </div>

            <button type="submit">Guardar Registro</button>
        </form>

        <a href="/registros" class="btn-view">Ver historial de registros →</a>
    </div>

</body>
</html>
